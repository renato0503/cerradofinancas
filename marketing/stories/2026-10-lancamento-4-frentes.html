<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="formato" content="1080x1920">
  <title>Story: Lançamento das 4 frentes</title>
  <link rel="stylesheet" href="../brand/tokens.css">
  <script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
  <style>
    body { display: flex; justify-content: center; padding: 40px 0; }
    html.exportando body { padding: 0; }

    /* Área segura dos Stories: ~250px livres no topo e na base (barra de progresso e campo de resposta) */
    .slide {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      color: #fff;
      padding: 230px 90px 280px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 14%, rgba(254, 203, 0, 0.2) 0%, transparent 38%),
        linear-gradient(170deg, var(--azul) 0%, #001645 55%, var(--azul-noite) 100%);
    }

    .slide::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.035) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.035) 1px, transparent 1px);
      background-size: 54px 54px;
      mask-image: linear-gradient(180deg, #000 0%, transparent 70%);
    }

    .slide > * { position: relative; }

    .folha {
      width: 220px;
      filter: drop-shadow(0 30px 50px rgba(0, 0, 0, 0.55));
    }

    h1 {
      margin-top: 40px;
      font-size: 108px;
      font-weight: 900;
      line-height: 1;
      letter-spacing: -4px;
    }

    h1 span { color: var(--dourado); }

    .sub {
      margin-top: 28px;
      font-size: 42px;
      color: var(--texto-suave);
      line-height: 1.3;
    }

    .frentes {
      margin-top: 50px;
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .frente {
      display: flex;
      align-items: center;
      gap: 30px;
      text-align: left;
      background: rgba(255, 255, 255, 0.06);
      border: 2px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      padding: 22px 32px;
    }

    .frente i {
      width: 84px;
      height: 84px;
      border-radius: 26px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 56px;
      flex-shrink: 0;
      color: var(--c);
      background: color-mix(in srgb, var(--c) 16%, transparent);
    }

    .frente strong { display: block; font-size: 42px; font-weight: 800; }
    .frente span { font-size: 30px; color: var(--texto-suave); }

    .cta {
      margin-top: 44px;
      display: inline-flex;
      align-items: center;
      gap: 16px;
      background: var(--dourado);
      color: var(--azul);
      font-size: 44px;
      font-weight: 800;
      padding: 30px 54px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <section class="slide">
    <img class="folha" src="../../img/folinha-hero.png" alt="">
    <h1>Agora somos<br><span>4 frentes.</span></h1>
    <p class="sub">Um só parceiro para o seu negócio crescer.</p>

    <div class="frentes">
      <div class="frente" style="--c:#38bdf8"><i class="ph-duotone ph-code"></i><div><strong>Fábrica de Software</strong><span>ERPs, CRMs, IA e dashboards</span></div></div>
      <div class="frente" style="--c:#4ade80"><i class="ph-duotone ph-calculator"></i><div><strong>Contabilidade</strong><span>100% digital, BPO e controladoria</span></div></div>
      <div class="frente" style="--c:#fecb00"><i class="ph-duotone ph-hand-coins"></i><div><strong>Crédito</strong><span>Multi bancos, com a LS Intermediação</span></div></div>
      <div class="frente" style="--c:#a78bfa"><i class="ph-duotone ph-graduation-cap"></i><div><strong>Cursos</strong><span>IA na prática com a Cerraclass</span></div></div>
    </div>

    <span class="cta"><i class="ph-bold ph-globe"></i> cerradofinancas.com.br</span>
  </section>

  <script src="../brand/slides.js"></script>
</body>
</html>
