# Configuração mínima do Jekyll (GitHub Pages).
# Ao definir "exclude", a lista padrão do Jekyll deixa de valer, por isso ela é repetida aqui.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Documentação interna: fica no GitHub, mas não vira página do site
  - README.md
  - context.md
  - PROXIMOS_PASSOS.md
  - LICENSE.txt
  # Estúdio de conteúdo: só marketing/index.html (Central de Marketing),
  # marketing/entregas/ e marketing/kits/ são publicados. Pasta nova em marketing/ deve entrar aqui.
  - marketing/.claude
  - marketing/README.md
  - marketing/HISTORICO.md
  - marketing/PLANEJAMENTO-credito-consultorias.md
  - marketing/brand
  - marketing/posts
  - marketing/tools
  - marketing/videos
  - marketing/filmes
  - marketing/animacoes
  - marketing/dados
