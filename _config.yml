# Configuração mínima do Jekyll (GitHub Pages).
# Ao definir "exclude", a lista padrão do Jekyll deixa de valer, por isso ela é repetida aqui.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Documentação interna: fica no GitHub, mas não vira página do site
  - README.md
  - context.md
  - PROXIMOS_PASSOS.md
  - PLANO-FABRICA.md
  # Estúdio da nova /fabrica (mostruário 3D e capturas): uso interno
  - fabrica-estudio
  - LICENSE.txt
  # Estúdio de conteúdo: só marketing/index.html (Central de Marketing),
  # marketing/entregas/, marketing/kits/ e marketing/formatos/ são publicados.
  # Pasta nova em marketing/ deve entrar aqui.
  - marketing/.claude
  - marketing/README.md
  - marketing/HISTORICO.md
  - marketing/PLANEJAMENTO-credito-consultorias.md
  - marketing/PLANEJAMENTO-cerraai.md
  - marketing/brand
  - marketing/conteudo
  - marketing/tools
  - marketing/filmes
  - marketing/palestras
  - marketing/dados
  # Propostas comerciais (valores de clientes): uso interno, nunca publicar
  - marketing/propostas
  # Documentos da parceria LS (portfólio e comissionamento): uso interno, não publicar
  - PortfolioParceriaLS
