# Configuração mínima do Jekyll (GitHub Pages).
# Ao definir "exclude", a lista padrão do Jekyll deixa de valer, por isso ela é repetida aqui.
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  # Estúdio de conteúdo: só marketing/index.html (Central de Conteúdos) e
  # marketing/entregas/ são publicados. Pasta nova em marketing/ deve entrar aqui.
  - marketing/.claude
  - marketing/README.md
  - marketing/brand
  - marketing/posts
  - marketing/tools
  - marketing/videos
  - marketing/animacoes
